<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YTM Sound Effects</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true"></div>
    <canvas id="viz" class="viz" aria-hidden="true"></canvas>

    <header class="hero">
      <img class="logo" src="icons/48.png" alt="" width="34" height="34" />
      <div class="hero-text">
        <h1>Sound Effects</h1>
        <p>YouTube Music &middot; reverb &amp; EQ</p>
      </div>
      <label class="power" title="Enable or bypass the effect chain">
        <input type="checkbox" id="enabled" class="sr" checked />
        <span class="power-track" aria-hidden="true"><span class="power-knob"></span></span>
        <span class="power-state" aria-hidden="true"></span>
        <span class="sr">Sound effects</span>
      </label>
    </header>

    <div id="note" class="note" hidden>
      <span id="noteText"></span>
      <button id="noteAction" class="note-action" type="button" hidden>Reload tab</button>
    </div>

    <main id="controls">
      <fieldset class="chips">
        <legend class="sr">Presets</legend>
        <button type="button" class="chip is-active" data-preset="Flat">Flat</button>
        <button type="button" class="chip" data-preset="Bass">Bass</button>
        <button type="button" class="chip" data-preset="Vocal">Vocal</button>
        <button type="button" class="chip" data-preset="Live">Live</button>
        <button type="button" class="chip" data-preset="Hall">Hall</button>
      </fieldset>

      <section class="card eq-card">
        <div class="card-head">
          <h2>Equalizer</h2>
          <span class="unit">&minus;12 &hellip; +12 dB</span>
        </div>
        <div id="eqBands" class="eq-bands"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Output</h2>
        </div>

        <div class="slider-row">
          <div class="slider-meta">
            <label class="slider-name" for="bass">Bass boost</label>
            <output id="bassOut" class="value" for="bass">0 dB</output>
          </div>
          <input type="range" class="h" id="bass" min="0" max="15" step="0.5" value="0" />
        </div>

        <div class="slider-row">
          <div class="slider-meta">
            <label class="slider-name" for="preamp">Pre-amp</label>
            <output id="preampOut" class="value" for="preamp">0 dB</output>
          </div>
          <input type="range" class="h" id="preamp" min="-12" max="12" step="1" value="0" />
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Reverb</h2>
        </div>

        <div class="slider-row">
          <div class="slider-meta">
            <label class="slider-name" for="mix">Mix</label>
            <output id="mixOut" class="value" for="mix">0 %</output>
          </div>
          <input type="range" class="h" id="mix" min="0" max="100" step="1" value="0" />
        </div>

        <div class="slider-row">
          <div class="slider-meta">
            <label class="slider-name" for="decay">Decay</label>
            <output id="decayOut" class="value" for="decay">1.8 s</output>
          </div>
          <input type="range" class="h" id="decay" min="0.3" max="4" step="0.1" value="1.8" />
        </div>
      </section>

      <fieldset class="profiles">
        <legend class="sr">Settings profiles</legend>

        <div class="prof-row" id="profMain">
          <label class="sr" for="profileSelect">Saved profiles</label>
          <select id="profileSelect" class="txt" disabled>
            <option value="">No saved profiles</option>
          </select>
          <button id="profileSaveStart" class="mini" type="button">Save&hellip;</button>
          <button id="profileDelete" class="mini mini-del" type="button" title="Delete profile" aria-label="Delete profile" disabled>&times;</button>
        </div>

        <div class="prof-row" id="profSave" hidden>
          <label class="sr" for="profileName">Profile name</label>
          <input id="profileName" class="txt" type="text" maxlength="24" placeholder="Profile name" required />
          <button id="profileSave" class="mini" type="button">Save</button>
          <button id="profileCancel" class="mini mini-del" type="button" title="Cancel" aria-label="Cancel">&times;</button>
        </div>
      </fieldset>
    </main>

    <footer class="foot">
      <button id="reset" type="button" class="ghost">Reset all</button>
      <span class="version">v0.3.0</span>
    </footer>

    <script src="audio.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
