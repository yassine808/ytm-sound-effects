<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YTM Sound Effects</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="chip" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
        </span>
        <span>YTM Sound Effects</span>
      </div>
      <label class="switch" title="Enable / bypass effects">
        <input type="checkbox" id="enabled" />
        <span class="track" aria-hidden="true"><span class="knob"></span></span>
        <span class="sr">Enabled</span>
      </label>
    </header>

    <p id="note" class="note" hidden></p>

    <main id="controls">
      <section class="block">
        <div class="head">
          <span class="title">Pre-amp</span>
          <output id="preampOut" class="value">0 dB</output>
        </div>
        <input type="range" id="preamp" min="-12" max="12" step="1" value="0" />
      </section>

      <section class="block">
        <div class="head">
          <span class="title">Equalizer</span>
          <span class="hint">−12 / +12 dB</span>
        </div>
        <div id="eqBands" class="eq-bands"></div>
      </section>

      <section class="block">
        <div class="head">
          <span class="title">Bass boost</span>
          <output id="bassOut" class="value">0 dB</output>
        </div>
        <input type="range" id="bass" min="0" max="15" step="0.5" value="0" />
      </section>

      <section class="block">
        <div class="head">
          <span class="title">Reverb mix</span>
          <output id="mixOut" class="value">0 %</output>
        </div>
        <input type="range" id="mix" min="0" max="100" step="1" value="0" />
      </section>

      <section class="block">
        <div class="head">
          <span class="title">Reverb decay</span>
          <output id="decayOut" class="value">1.8 s</output>
        </div>
        <input type="range" id="decay" min="0.3" max="4" step="0.1" value="1.8" />
      </section>

      <section class="block bottom">
        <div class="head">
          <label class="title" for="preset">Preset</label>
        </div>
        <div class="actions">
          <select id="preset">
            <option value="Flat">Flat</option>
            <option value="Bass">Bass</option>
            <option value="Vocal">Vocal</option>
            <option value="Live">Live</option>
            <option value="Hall">Hall</option>
          </select>
          <button id="reset" type="button">Reset</button>
        </div>
      </section>
    </main>

    <script src="audio.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
